<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("site-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<title>Young Gou — Play History</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/profile.css" />
<link rel="stylesheet" href="css/subpage.css" />
</head>
<body data-page="games" data-root="">

<!-- Page art. Decorative only: it sits behind everything (z-index -1, above
     the backdrop canvas), is masked away toward the page column, and is
     dropped entirely below 1100px where there is no room for it. -->
<div class="games-art" aria-hidden="true"></div>

<div id="chromeTop"></div>
<nav id="chromeNav"></nav>

<div class="profile-bar">
  <a class="back-link" id="gamesBack" href="index.html"></a></div>

<main class="resume" id="gamesMain">
  <div class="resume-header" style="border-bottom-color: var(--color-line);">
    <div>
      <p class="mono detail-tag" id="gamesTag"></p>
      <h1 id="gamesTitle"></h1>
    </div>
  </div>

  <section class="resume-section games">
    <!-- The cloud is the page's index: every entry is a tag, sized by how many
         titles carry it, and clicking one scrolls to that tag's section. -->
    <div class="tag-cloud" id="tagCloud"></div>
    <p class="tag-hint mono" id="cloudHint"></p>

    <div class="game-controls">
      <input type="search" id="gameSearch" class="game-search" />
    </div>

    <p class="game-meta" id="gamesEmpty" hidden></p>
    <div id="tagSections"></div>
  </section>

  <div class="page-contact-cta" id="pageContactCta"></div>
</main>

<footer id="chromeFooter"></footer>

<script src="js/content.js"></script>
<script src="js/games-data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/games.js"></script>
</body>
</html>
