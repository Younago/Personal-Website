<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("site-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<title>Young Gou — RefFix</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/profile.css" />
<link rel="stylesheet" href="../css/subpage.css" />
</head>
<body data-page="reffix" data-root="../">

<div id="chromeTop"></div>
<nav id="chromeNav"></nav>

<div class="profile-bar">
  <a class="back-link" id="reffixBack" href="../ai-feedback.html"></a>
</div>

<main class="resume">
  <div class="resume-header" style="border-bottom-color: var(--color-line);">
    <div>
      <p class="mono detail-tag" data-i18n="reffixPage.tagLabel"></p>
      <h1 data-i18n="reffixPage.heading"></h1>
    </div>
  </div>

  <section class="resume-section">
    <p class="resume-summary" data-i18n="reffixPage.lead"></p>
    <div class="tool-actions">
      <a class="btn-download" id="reffixOpen" href="#" target="_blank" rel="noopener"
         data-i18n="reffixPage.openLabel"></a>
      <a class="link-more mono" id="reffixRepo" href="#" target="_blank" rel="noopener"
         data-i18n="reffixPage.repoLabel"></a>
    </div>
  </section>

  <div id="reffixBody"></div>

  <section class="resume-section">
    <p class="ai-tool-disclaimer" data-i18n="reffixPage.embedNote"></p>
    <!-- The iframe src is set by pages.js rather than hardcoded here, so the
         demo URL lives in content.js with everything else that might change. -->
    <div class="tool-embed">
      <iframe id="reffixFrame" title="RefFix" loading="lazy"
              referrerpolicy="no-referrer"
              sandbox="allow-scripts allow-downloads allow-popups allow-popups-to-escape-sandbox"></iframe>
    </div>
  </section>

  <div class="page-contact-cta" id="pageContactCta"></div>
</main>

<footer id="chromeFooter"></footer>

<script src="../js/content.js"></script>
<script src="../js/chrome.js"></script>
<script src="../js/pages.js"></script>
</body>
</html>
