<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("site-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<title>Young Gou — Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/profile.css" />
<link rel="stylesheet" href="css/subpage.css" />
</head>
<body data-page="experience" data-root="">

<div id="chromeTop"></div>
<nav id="chromeNav"></nav>

<div class="profile-bar">
  <a class="back-link" id="expBack" href="index.html"></a></div>

<main class="resume">
  <div class="resume-header" style="border-bottom-color: var(--color-line);">
    <div>
      <p class="mono detail-tag" id="expTag"></p>
      <h1 id="expHeading"></h1>
      <p class="resume-summary" id="expLead"></p>
    </div>
  </div>

  <section class="resume-section">
    <h2 id="timelineHeading"></h2>
    <p class="timeline-hint mono" id="timelineHint"></p>

    <div class="timeline">
      <!-- tabindex on the rail itself is what makes the arrow keys work
           without adding a tab stop for every card. -->
      <ol class="timeline-rail" id="timelineRail" tabindex="0" role="list"></ol>
      <div class="timeline-progress"><span id="timelineProgress"></span></div>
    </div>
  </section>

  <section class="resume-section">
    <h2 id="gamesHeading"></h2>
    <p class="resume-summary" id="gamesLead"></p>

    <div class="game-stats" id="gameStats"></div>

    <div class="game-controls">
      <div class="game-tabs">
        <!-- "anime" is a filter across both platform groups rather than a
             third platform, so a title can appear here and under its own
             platform tab. It leads because that is where most of the hours
             are. -->
        <button type="button" data-group="anime" aria-pressed="true" id="tabAnime"></button>
        <button type="button" data-group="console" aria-pressed="false" id="tabConsole"></button>
        <button type="button" data-group="mobile" aria-pressed="false" id="tabMobile"></button>
      </div>
      <input type="search" id="gameSearch" class="game-search" />
      <button type="button" class="game-toggle" id="gamesToggle" aria-expanded="false" aria-controls="gameTableWrap"></button>
    </div>

    <div id="gameTableWrap" hidden>
      <p class="game-meta mono"><span id="gameCount"></span> · <span id="sortHint"></span></p>
      <div class="article-table-wrap">
        <table class="article-table game-table">
          <thead>
            <tr>
              <th data-sort="name" id="colName" scope="col" aria-sort="none"></th>
              <th data-sort="time" id="colTime" scope="col" aria-sort="none"></th>
              <th id="colNote" scope="col"></th>
            </tr>
          </thead>
          <tbody id="gameRows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <div class="page-contact-cta" id="pageContactCta"></div>
</main>

<footer id="chromeFooter"></footer>

<script src="js/content.js"></script>
<script src="js/games-data.js"></script>
<script src="js/chrome.js"></script>
<script src="js/experience.js"></script>
</body>
</html>
