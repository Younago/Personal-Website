<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("site-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<title>Young Gou — AI Playtest Feedback Tool</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/profile.css" />
<link rel="stylesheet" href="css/subpage.css" />
</head>
<body data-page="ai-hub" data-root="">

<div id="chromeTop"></div>
<nav id="chromeNav"></nav>

<div class="profile-bar">
  <a class="back-link" href="index.html">← Back to site</a></div>

<main class="resume">
  <div class="resume-header" style="border-bottom-color: var(--color-line);">
    <div>
      <p class="mono detail-tag" data-i18n="aiHubPage.tagLabel"></p>
      <h1 data-i18n="aiHubPage.heading"></h1>
    </div>
  </div>

  <section class="resume-section">
    <p class="resume-summary" data-i18n="aiHubPage.lead"></p>
  </section>

  <!-- Tools first, then side projects: the tools are the things a visitor can
       actually run without leaving the page, so they earn the top slot. -->
  <section class="resume-section">
    <h2 data-i18n="aiHubPage.toolsHeading"></h2>
    <p class="resume-summary" data-i18n="aiHubPage.toolsIntro" style="margin-bottom: 16px;"></p>
    <div class="projects-grid" id="aiToolsGrid"></div>
  </section>

  <section class="resume-section">
    <h2 data-i18n="aiHubPage.projectsHeading"></h2>
    <p class="resume-summary" data-i18n="aiHubPage.projectsIntro" style="margin-bottom: 16px;"></p>
    <div class="projects-grid" id="aiProjectsGrid"></div>
  </section>

  <div class="page-contact-cta" id="pageContactCta"></div>
</main>

<footer id="chromeFooter"></footer>

<script src="js/content.js"></script>
<script src="js/chrome.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
