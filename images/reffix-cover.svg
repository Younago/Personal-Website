<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-label="RefFix — reference list before and after formatting">
  <!--
    Cover art for the RefFix card. Deliberately abstract rather than a
    screenshot: the site's other thumbnails are photographs or key art, and a
    shrunken UI screenshot reads as noise at card size. What survives at
    240px wide is the shape of the idea — a ragged reference list on top, the
    same list aligned underneath — so that is all this draws.

    Palette is lifted from the site's own colour tokens (page background,
    hairline, accent) so the card sits in the grid without announcing itself.
    Note for future edits: XML comments cannot contain a double hyphen, so
    the CSS variables those colours come from can't be named here.
  -->
  <rect width="480" height="360" fill="#eef0f3"/>

  <!-- paper -->
  <rect x="56" y="40" width="368" height="280" fill="#ffffff" stroke="#c8ccd3"/>

  <!-- BEFORE: uneven indents, inconsistent line lengths, one flagged item -->
  <g fill="#c2c7cf">
    <rect x="88" y="78"  width="196" height="7" rx="1"/>
    <rect x="88" y="95"  width="128" height="7" rx="1"/>
    <rect x="104" y="122" width="232" height="7" rx="1"/>
    <rect x="96"  y="139" width="88"  height="7" rx="1"/>
  </g>
  <!-- the one line that cannot be auto-fixed: flagged, not silently rewritten -->
  <rect x="88" y="166" width="150" height="7" rx="1" fill="#e0b4b2"/>
  <rect x="76" y="164" width="3" height="11" fill="#c9302c"/>

  <!-- divider: the correction step -->
  <line x1="88" y1="196" x2="392" y2="196" stroke="#c8ccd3" stroke-dasharray="3 5"/>
  <path d="M240 186 L240 206 M234 200 L240 206 L246 200" fill="none" stroke="#3a5fd9" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- AFTER: one hanging indent, consistent rhythm, uniform colour -->
  <g fill="#3a5fd9">
    <rect x="88" y="224" width="248" height="7" rx="1"/>
    <rect x="112" y="241" width="176" height="7" rx="1"/>
    <rect x="88" y="264" width="248" height="7" rx="1"/>
    <rect x="112" y="281" width="208" height="7" rx="1"/>
  </g>
  <rect x="76" y="222" width="3" height="68" fill="#3a5fd9" opacity="0.35"/>

  <text x="56" y="345" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace"
        font-size="11" letter-spacing="1.6" fill="#666e79">IEEE · APA 7 · MLA 9</text>
  <text x="424" y="345" text-anchor="end" font-family="IBM Plex Mono, SFMono-Regular, Consolas, monospace"
        font-size="11" letter-spacing="1.6" fill="#666e79">IN-BROWSER</text>
</svg>
