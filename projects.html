<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script>(function(){try{var t=localStorage.getItem("site-theme");if(t==="dark")document.documentElement.setAttribute("data-theme","dark");}catch(e){}})();</script>
<title>Young Gou — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/profile.css" />
<link rel="stylesheet" href="css/subpage.css" />
</head>
<body data-page="projects" data-root="">

<div id="chromeTop"></div>
<nav id="chromeNav"></nav>

<div class="profile-bar">
  <a class="back-link" href="index.html">← Back to site</a></div>

<main class="resume">
  <div class="resume-header" style="border-bottom-color: var(--color-line);">
    <div>
      <h1 data-i18n="projects.heading"></h1>
    </div>
  </div>

  <section class="resume-section">
    <h2 data-i18n="teamProjects.heading"></h2>
    <div class="projects-grid is-stacked" id="teamGrid"></div>
  </section>

  <section class="resume-section">
    <h2 data-i18n="individualProjects.heading"></h2>
    <p class="resume-summary" data-i18n="individualProjects.intro" style="margin-bottom: 16px;"></p>
    <div class="projects-grid is-stacked" id="individualGrid"></div>
  </section>

  <section class="resume-section">
    <h2 data-i18n="gameAnalysis.heading"></h2>
    <p class="resume-summary" data-i18n="gameAnalysis.intro" style="margin-bottom: 16px;"></p>
    <div class="projects-grid is-stacked" id="analysisGrid"></div>
  </section>

  <div class="page-contact-cta" id="pageContactCta"></div>
</main>

<footer id="chromeFooter"></footer>

<script src="js/content.js"></script>
<script src="js/chrome.js"></script>
<!-- Loaded before pages.js on purpose: pages.js renders the cards inline at
     parse time and calls SITE_MOTION.scan() as it goes, so the entrance
     animation is set up in the same task the cards are built in and the first
     screen never flashes visible-then-hidden. -->
<script src="js/motion.js"></script>
<script src="js/pages.js"></script>
</body>
</html>
